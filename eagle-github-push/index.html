<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>GitHub Push</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="opacity:.9">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      GitHub Push
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="push">推送</button>
      <button class="tab" data-tab="settings">設定</button>
    </div>
  </div>

  <!-- ── Push Tab ── -->
  <div id="tab-push" class="tab-panel">

    <!-- Empty state -->
    <div id="no-items" class="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <p>在 Eagle 中選取圖片<br>然後開啟此視窗</p>
      <button id="btn-refresh" class="btn-secondary">重新整理</button>
    </div>

    <!-- Items ready -->
    <div id="items-view" style="display:none">
      <div class="toolbar">
        <span id="item-count" class="dim"></span>
        <div style="display:flex;gap:6px;align-items:center">
          <button id="btn-refresh-list" class="btn-icon" title="重新整理">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
          </button>
          <button id="btn-push-all" class="btn-primary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
            推送全部
          </button>
        </div>
      </div>

      <input id="commit-message" type="text" placeholder="Commit 訊息（留白自動產生）" style="width:100%;margin-bottom:10px">

      <div id="items-list"></div>

      <div id="push-log" style="display:none">
        <div class="log-header">
          <span>推送紀錄</span>
          <button id="btn-clear-log" class="btn-text">清除</button>
        </div>
        <div id="log-entries"></div>
      </div>
    </div>
  </div>

  <!-- ── Settings Tab ── -->
  <div id="tab-settings" class="tab-panel" style="display:none">
    <div class="form-group">
      <label>
        GitHub Personal Access Token
        <a class="hint-link" href="#" id="token-help-link">(如何取得？)</a>
      </label>
      <div class="input-row">
        <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <button type="button" id="btn-show-token" class="btn-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <span class="hint">需要 <code>repo</code> 或 <code>contents:write</code> 權限</span>
    </div>

    <div class="form-group">
      <label>Repository</label>
      <input type="text" id="github-repo" placeholder="owner/repo-name">
      <span class="hint">例如：<code>lijingchiu/futureskart</code></span>
    </div>

    <div class="form-group">
      <label>Branch</label>
      <input type="text" id="github-branch" placeholder="main">
    </div>

    <div class="form-group">
      <label>目標路徑</label>
      <input type="text" id="github-path" placeholder="images/">
      <span class="hint">圖片上傳目錄。留白表示 Repo 根目錄</span>
    </div>

    <div class="form-group">
      <label class="row-label">
        <input type="checkbox" id="use-subfolder">
        依 Eagle 資料夾名稱自動建立子目錄
      </label>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">
      <button id="btn-test" class="btn-secondary">測試連線</button>
      <button id="btn-save" class="btn-primary">儲存設定</button>
    </div>

    <div id="settings-msg" class="msg" style="display:none;margin-top:10px"></div>
  </div>

  <script src="js/plugin.js"></script>
</body>
</html>
