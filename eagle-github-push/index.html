<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GitHub Push</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#1e2128;--bg2:#262b35;--bg3:#2d3340;
      --bd:#3a4050;--tx:#dde1ea;--dim:#8890a0;
      --ac:#4f8ef7;--acH:#6ba3ff;
      --ok:#3dba74;--er:#e05c5c;--wa:#e8a838;
      --r:6px;
      --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }

    html{height:100%;background:var(--bg)}
    body{
      height:100%;display:flex;flex-direction:column;
      background:var(--bg);color:var(--tx);
      font-family:var(--f);font-size:13px;line-height:1.5;
      overflow:hidden;
    }

    /* scrollbar */
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

    /* header */
    #header{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 14px;background:var(--bg2);
      border-bottom:1px solid var(--bd);flex-shrink:0;
    }
    #logo{display:flex;align-items:center;gap:7px;font-weight:600;padding:11px 0}
    #tabs{display:flex}
    .tab{
      background:none;border:none;border-bottom:2px solid transparent;
      color:var(--dim);cursor:pointer;font-size:13px;font-family:var(--f);
      padding:11px 14px 9px;margin-bottom:-1px;
      transition:color .15s,border-color .15s;
    }
    .tab:hover{color:var(--tx)}
    .tab.active{color:var(--ac);border-bottom-color:var(--ac)}

    /* panels */
    .panel{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:none}
    .panel.active{display:block}

    /* empty state */
    #no-items{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:12px;padding:70px 20px;
      color:var(--dim);text-align:center;
    }
    #no-items svg{opacity:.35}
    #no-items p{font-size:13px;line-height:1.7}

    /* toolbar */
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .dim{color:var(--dim);font-size:12px}
    .flex-gap{display:flex;align-items:center;gap:6px}

    /* item rows */
    #items-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
    .item-row{
      display:flex;align-items:center;gap:9px;
      background:var(--bg2);border:1px solid var(--bd);
      border-radius:var(--r);padding:7px 9px;
      transition:border-color .15s;
    }
    .item-row:hover{border-color:var(--ac)}
    .item-row.pushing{border-color:var(--wa)}
    .item-row.done{border-color:var(--ok)}
    .item-row.failed{border-color:var(--er)}
    .thumb{
      width:38px;height:38px;object-fit:cover;
      border-radius:4px;flex-shrink:0;background:var(--bg3);
    }
    .thumb-ph{
      width:38px;height:38px;display:flex;align-items:center;justify-content:center;
      border-radius:4px;background:var(--bg3);color:var(--dim);
      font-size:10px;flex-shrink:0;text-transform:uppercase;
    }
    .iinfo{flex:1;min-width:0}
    .iname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .imeta{font-size:11px;color:var(--dim);margin-top:1px}
    .istat{font-size:11px;flex-shrink:0;color:var(--dim)}
    .istat.pushing{color:var(--wa)}
    .istat.done{color:var(--ok)}
    .istat.failed{color:var(--er)}
    .ibtn{
      flex-shrink:0;background:none;border:1px solid var(--bd);
      color:var(--dim);border-radius:4px;padding:3px 8px;
      font-size:11px;font-family:var(--f);cursor:pointer;
      transition:border-color .15s,color .15s;
    }
    .ibtn:hover{border-color:var(--ac);color:var(--ac)}
    .ibtn:disabled{opacity:.4;cursor:default}

    /* log */
    #log-wrap{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:none}
    .log-hdr{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--dim)}
    #log-body{padding:6px 10px;max-height:140px;overflow-y:auto;font-size:11px;line-height:1.9;font-family:"SF Mono",Menlo,monospace}
    .le{display:flex;gap:8px}
    .le-t{color:var(--dim);flex-shrink:0}
    .ok{color:var(--ok)}.er{color:var(--er)}.info{color:var(--dim)}

    /* settings */
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
    .fg>label{font-size:12px;font-weight:500}
    .hint{font-size:11px;color:var(--dim)}
    .row2{display:flex;gap:6px}
    .row2 input{flex:1}
    .ck{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;font-weight:400}
    .ck input{accent-color:var(--ac);width:13px;height:13px}

    /* inputs */
    input[type=text],input[type=password]{
      background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
      color:var(--tx);font-size:12px;font-family:var(--f);
      padding:7px 10px;outline:none;width:100%;transition:border-color .15s;
    }
    input:focus{border-color:var(--ac)}
    input::placeholder{color:var(--dim)}

    /* status msg */
    .msg{padding:8px 11px;border-radius:var(--r);font-size:12px;margin-top:10px;display:none}
    .msg.ok{background:rgba(61,186,116,.12);color:var(--ok);border:1px solid rgba(61,186,116,.3)}
    .msg.er{background:rgba(224,92,92,.12);color:var(--er);border:1px solid rgba(224,92,92,.3)}
    .msg.inf{background:rgba(79,142,247,.1);color:var(--ac);border:1px solid rgba(79,142,247,.3)}

    /* buttons */
    .btn-p{
      background:var(--ac);color:#fff;border:none;border-radius:var(--r);
      padding:7px 13px;font-size:12px;font-weight:500;font-family:var(--f);
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s;
    }
    .btn-p:hover{background:var(--acH)}
    .btn-p:disabled{opacity:.5;cursor:default}
    .btn-s{
      background:var(--bg3);color:var(--tx);border:1px solid var(--bd);
      border-radius:var(--r);padding:7px 13px;font-size:12px;font-family:var(--f);
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:border-color .15s,color .15s;
    }
    .btn-s:hover{border-color:var(--ac);color:var(--ac)}
    .btn-s:disabled{opacity:.5;cursor:default}
    .btn-i{
      background:var(--bg3);color:var(--dim);border:1px solid var(--bd);
      border-radius:var(--r);padding:5px 8px;cursor:pointer;
      display:inline-flex;align-items:center;transition:border-color .15s,color .15s;
    }
    .btn-i:hover{border-color:var(--ac);color:var(--ac)}
    .btn-t{background:none;border:none;color:var(--dim);font-size:11px;font-family:var(--f);cursor:pointer;padding:0}
    .btn-t:hover{color:var(--tx)}
    .row-end{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

    code{font-size:11px;background:var(--bg3);padding:1px 4px;border-radius:3px}
  </style>
</head>
<body>

<!-- ── Header ── -->
<div id="header">
  <div id="logo">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    GitHub Push
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="push">推送</button>
    <button class="tab" data-tab="settings">設定</button>
  </div>
</div>

<!-- ── Push panel ── -->
<div id="panel-push" class="panel active">

  <div id="no-items">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <p>在 Eagle 中選取圖片<br>然後點「重新整理」</p>
    <button id="btn-refresh" class="btn-s">重新整理</button>
  </div>

  <div id="items-view" style="display:none">
    <div class="toolbar">
      <span id="item-count" class="dim"></span>
      <div class="flex-gap">
        <button id="btn-refresh2" class="btn-i" title="重新整理">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
        <button id="btn-push-all" class="btn-p">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
          推送全部
        </button>
      </div>
    </div>

    <input id="commit-msg" type="text" placeholder="Commit 訊息（留白自動產生）" style="margin-bottom:10px">

    <div id="items-list"></div>

    <div id="log-wrap">
      <div class="log-hdr">
        <span>推送紀錄</span>
        <button id="btn-clear-log" class="btn-t">清除</button>
      </div>
      <div id="log-body"></div>
    </div>
  </div>
</div>

<!-- ── Settings panel ── -->
<div id="panel-settings" class="panel">

  <div class="fg">
    <label>GitHub Personal Access Token</label>
    <div class="row2">
      <input type="password" id="s-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
      <button id="btn-eye" class="btn-i" title="顯示/隱藏">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <span class="hint">需要 <code>repo</code> 或 <code>contents:write</code> 權限</span>
  </div>

  <div class="fg">
    <label>Repository</label>
    <input type="text" id="s-repo" placeholder="owner/repo-name">
    <span class="hint">例如：<code>lijingchiu/futureskart</code></span>
  </div>

  <div class="fg">
    <label>Branch</label>
    <input type="text" id="s-branch" placeholder="main">
  </div>

  <div class="fg">
    <label>目標路徑 (Target Path)</label>
    <input type="text" id="s-path" placeholder="images/">
    <span class="hint">圖片上傳到此目錄。留白 = Repo 根目錄</span>
  </div>

  <div class="fg">
    <label class="ck">
      <input type="checkbox" id="s-sub">
      依 Eagle 資料夾名稱自動建立子目錄
    </label>
  </div>

  <div class="row-end">
    <button id="btn-test" class="btn-s">測試連線</button>
    <button id="btn-save" class="btn-p">儲存設定</button>
  </div>

  <div id="s-msg" class="msg"></div>
</div>

<script>
(function () {
  'use strict';

  // ── Storage ──────────────────────────────────────────────────────────────
  const KEY = 'eagle_gh_push_v2';
  const loadCfg = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const saveCfg = o => localStorage.setItem(KEY, JSON.stringify(o));

  // ── DOM helpers ───────────────────────────────────────────────────────────
  const $  = id => document.getElementById(id);
  const show  = (id, v) => $(id).style.display = v ? '' : 'none';
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmt = b => !b?'': b<1024?b+' B': b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';

  // ── GitHub REST API ───────────────────────────────────────────────────────
  async function ghReq(method, path, token, body) {
    const opts = {
      method,
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'User-Agent': 'Eagle-GitHub-Push/2.0',
      }
    };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch('https://api.github.com' + path, opts);
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function getFileSha(token, owner, repo, fp, branch) {
    const enc = fp.split('/').map(encodeURIComponent).join('/');
    const { ok, data } = await ghReq('GET', `/repos/${owner}/${repo}/contents/${enc}?ref=${branch}`, token);
    return (ok && data.sha) ? data.sha : null;
  }

  async function uploadFile(token, owner, repo, branch, fp, b64, msg) {
    const enc = fp.split('/').map(encodeURIComponent).join('/');
    const sha = await getFileSha(token, owner, repo, fp, branch);
    const body = { message: msg, content: b64, branch };
    if (sha) body.sha = sha;
    return ghReq('PUT', `/repos/${owner}/${repo}/contents/${enc}`, token, body);
  }

  // ── File system (Node.js available in Eagle) ──────────────────────────────
  function readB64(filePath) {
    const fs = require('fs');
    return fs.readFileSync(filePath).toString('base64');
  }
  function fileOk(filePath) {
    try { require('fs').accessSync(filePath); return true; } catch { return false; }
  }

  // ── Log ───────────────────────────────────────────────────────────────────
  function log(msg, type) {
    show('log-wrap', true);
    const t = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    const cls = type === 'ok' ? 'ok' : type === 'er' ? 'er' : 'info';
    const div = document.createElement('div');
    div.className = 'le';
    div.innerHTML = `<span class="le-t">${t}</span><span class="${cls}">${esc(msg)}</span>`;
    const lb = $('log-body');
    lb.appendChild(div);
    lb.scrollTop = lb.scrollHeight;
  }

  // ── Push tab ──────────────────────────────────────────────────────────────
  let ITEMS = [];

  async function refresh() {
    ITEMS = [];
    let items = [];
    try { items = await eagle.item.getSelected(); } catch(e) { console.error('getSelected:', e); }

    if (!items || !items.length) {
      show('no-items', true);
      show('items-view', false);
      return;
    }

    ITEMS = items;
    show('no-items', false);
    show('items-view', true);
    $('item-count').textContent = '已選取 ' + items.length + ' 個項目';

    const list = $('items-list');
    list.innerHTML = '';
    items.forEach((item, i) => list.appendChild(makeRow(item, i)));
  }

  function makeRow(item, idx) {
    const ext = item.ext || '';
    const row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.idx = idx;

    const thumbHtml = item.thumbnailUrl
      ? `<img class="thumb" src="${esc(item.thumbnailUrl)}" onerror="this.className='thumb-ph';this.textContent='${esc(ext)}'">`
      : `<div class="thumb-ph">${esc(ext)}</div>`;

    row.innerHTML = `
      ${thumbHtml}
      <div class="iinfo">
        <div class="iname">${esc(item.name)}.${esc(ext)}</div>
        <div class="imeta">${esc(fmt(item.fileSize || item.size || 0))}</div>
      </div>
      <span class="istat" data-st></span>
      <button class="ibtn">推送</button>
    `;
    row.querySelector('.ibtn').addEventListener('click', () => push([{ item, idx }]));
    return row;
  }

  function rowState(idx, state) {
    const row = document.querySelector(`.item-row[data-idx="${idx}"]`);
    if (!row) return;
    row.className = 'item-row ' + state;
    const st = row.querySelector('[data-st]');
    st.className = 'istat ' + state;
    st.textContent = { pushing: '…', done: '✓', failed: '✗' }[state] || '';
    const btn = row.querySelector('.ibtn');
    btn.disabled = (state === 'pushing' || state === 'done');
    btn.textContent = state === 'done' ? '✓' : state === 'pushing' ? '…' : '推送';
  }

  function destPath(cfg, item) {
    const name = `${item.name}.${item.ext || ''}`;
    let base = (cfg.targetPath || '').replace(/\/+$/, '');
    if (cfg.useSubfolder && item.folderName) base += '/' + item.folderName;
    return base ? base + '/' + name : name;
  }

  function autoMsg(items) {
    const custom = $('commit-msg').value.trim();
    if (custom) return custom;
    const d = new Date().toISOString().slice(0, 10);
    const names = items.map(i => `${i.name}.${i.ext}`).join(', ');
    return names.length > 80 ? `Add ${items.length} images via Eagle [${d}]` : `Add ${names} via Eagle [${d}]`;
  }

  async function push(jobs) {
    const cfg = loadCfg();
    if (!cfg.token) { log('⚠ 請先在「設定」填入 GitHub Token', 'er'); switchTab('settings'); return; }
    if (!cfg.repo || !cfg.repo.includes('/')) { log('⚠ 請先在「設定」填入 Repository', 'er'); switchTab('settings'); return; }

    const [owner, repo] = cfg.repo.split('/');
    const branch = cfg.branch || 'main';
    const msg = autoMsg(jobs.map(j => j.item));
    const allBtn = $('btn-push-all');
    allBtn.disabled = true;

    for (const { item, idx } of jobs) {
      rowState(idx, 'pushing');
      const fp = item.filePath || item.path;
      if (!fp || !fileOk(fp)) {
        rowState(idx, 'failed');
        log(`✗ ${item.name}: 找不到本地檔案`, 'er');
        continue;
      }
      let b64;
      try { b64 = readB64(fp); }
      catch (e) { rowState(idx, 'failed'); log(`✗ ${item.name}: 讀取失敗 – ${e.message}`, 'er'); continue; }

      const dest = destPath(cfg, item);
      log(`⟳ 上傳 ${item.name}.${item.ext} → ${dest}`, 'info');
      try {
        const { ok, status, data } = await uploadFile(cfg.token, owner, repo, branch, dest, b64, msg);
        if (ok) {
          rowState(idx, 'done');
          log(`✓ 成功${data.content && data.content.html_url ? ' → ' + data.content.html_url : ''}`, 'ok');
        } else {
          rowState(idx, 'failed');
          log(`✗ ${item.name}: ${data.message || '錯誤'} (HTTP ${status})`, 'er');
        }
      } catch(e) {
        rowState(idx, 'failed');
        log(`✗ ${item.name}: 網路錯誤 – ${e.message}`, 'er');
      }
    }
    allBtn.disabled = false;
  }

  // ── Settings tab ─────────────────────────────────────────────────────────
  function loadSettingsUI() {
    const c = loadCfg();
    if (c.token) $('s-token').value = c.token;
    if (c.repo)  $('s-repo').value  = c.repo;
    $('s-branch').value = c.branch || 'main';
    $('s-path').value   = c.targetPath || 'images/';
    if (c.useSubfolder) $('s-sub').checked = true;
  }

  function collectCfg() {
    return {
      token:       $('s-token').value.trim(),
      repo:        $('s-repo').value.trim(),
      branch:      $('s-branch').value.trim() || 'main',
      targetPath:  $('s-path').value.trim(),
      useSubfolder: $('s-sub').checked,
    };
  }

  function showMsg(text, cls) {
    const el = $('s-msg');
    el.textContent = text;
    el.className = 'msg ' + cls;
    el.style.display = '';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', 5000);
  }

  // ── Tab switching ─────────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    $('panel-push').classList.toggle('active', name === 'push');
    $('panel-settings').classList.toggle('active', name === 'settings');
  }

  // ── Wire up all event listeners ───────────────────────────────────────────
  function bindEvents() {
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
    $('btn-refresh').addEventListener('click', refresh);
    $('btn-refresh2').addEventListener('click', refresh);
    $('btn-push-all').addEventListener('click', () => push(ITEMS.map((item, idx) => ({ item, idx }))));
    $('btn-clear-log').addEventListener('click', () => { $('log-body').innerHTML = ''; show('log-wrap', false); });

    $('btn-eye').addEventListener('click', () => {
      const el = $('s-token');
      el.type = el.type === 'password' ? 'text' : 'password';
    });
    $('btn-save').addEventListener('click', () => {
      const c = collectCfg();
      if (!c.token) return showMsg('請填入 GitHub Token', 'er');
      if (!c.repo.includes('/')) return showMsg('Repository 格式應為 owner/repo', 'er');
      saveCfg(c);
      showMsg('設定已儲存 ✓', 'ok');
    });
    $('btn-test').addEventListener('click', async () => {
      const c = collectCfg();
      if (!c.token) return showMsg('請先填入 Token', 'er');
      if (!c.repo.includes('/')) return showMsg('請先填入 Repository', 'er');
      const btn = $('btn-test');
      btn.disabled = true; btn.textContent = '測試中…';
      showMsg('連線中…', 'inf');
      const [owner, repo] = c.repo.split('/');
      const { ok, data } = await ghReq('GET', `/repos/${owner}/${repo}`, c.token);
      btn.disabled = false; btn.textContent = '測試連線';
      ok ? showMsg(`✓ ${data.full_name}（${data.private ? '私有' : '公開'}）`, 'ok')
         : showMsg(`✗ ${data.message || '連線失敗'} (HTTP ${data.status || ''})`, 'er');
    });
  }

  // ── Eagle lifecycle (official pattern from eagle-custom-export) ───────────
  eagle.onPluginCreate(async () => {
    bindEvents();
    loadSettingsUI();
    await refresh();
  });

  eagle.onPluginShow(async () => {
    await refresh();
  });

})();
</script>
</body>
</html>
