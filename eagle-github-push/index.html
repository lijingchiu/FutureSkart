<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Push</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub Push
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="push">推送</button>
        <button class="tab" data-tab="settings">設定</button>
      </div>
    </div>

    <!-- Push Tab -->
    <div id="tab-push" class="tab-content active">
      <div id="no-items" class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>在 Eagle 中選取圖片<br>然後切換到此視窗</p>
        <button id="btn-refresh" class="btn-secondary">重新整理</button>
      </div>

      <div id="items-container" class="hidden">
        <div class="push-toolbar">
          <span id="item-count" class="item-count"></span>
          <div class="toolbar-actions">
            <button id="btn-refresh-list" class="btn-icon" title="重新整理">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
            </button>
            <button id="btn-push-all" class="btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
              推送全部
            </button>
          </div>
        </div>

        <div class="commit-msg-row">
          <input type="text" id="commit-message" placeholder="Commit 訊息（選填，留白自動產生）">
        </div>

        <div id="items-list" class="items-list"></div>

        <div id="push-log" class="push-log hidden">
          <div class="log-header">
            <span>推送紀錄</span>
            <button id="btn-clear-log" class="btn-text">清除</button>
          </div>
          <div id="log-entries" class="log-entries"></div>
        </div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content hidden">
      <form id="settings-form" class="settings-form">
        <div class="form-group">
          <label for="github-token">
            GitHub Personal Access Token
            <a class="help-link" href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </a>
          </label>
          <div class="input-with-toggle">
            <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
            <button type="button" class="btn-toggle-pass" data-target="github-token">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="hint">需要 <code>repo</code> 或 <code>contents:write</code> 權限</span>
        </div>

        <div class="form-group">
          <label for="github-repo">Repository</label>
          <input type="text" id="github-repo" placeholder="owner/repository-name">
          <span class="hint">例如：<code>lijingchiu/futureskart</code></span>
        </div>

        <div class="form-group">
          <label for="github-branch">Branch</label>
          <input type="text" id="github-branch" placeholder="main" value="main">
        </div>

        <div class="form-group">
          <label for="github-path">目標路徑 (Target Path)</label>
          <input type="text" id="github-path" placeholder="images/">
          <span class="hint">圖片會上傳到此路徑。留白表示 Repo 根目錄</span>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="use-subfolder">
            <span>按 Eagle 資料夾名稱自動建立子目錄</span>
          </label>
        </div>

        <div class="settings-actions">
          <button type="button" id="btn-test-connection" class="btn-secondary">測試連線</button>
          <button type="submit" id="btn-save-settings" class="btn-primary">儲存設定</button>
        </div>

        <div id="settings-status" class="status-msg hidden"></div>
      </form>
    </div>
  </div>

  <script src="js/plugin.js"></script>
</body>
</html>
